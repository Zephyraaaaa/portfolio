<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="泽菲拉的交互设计作品《伦敦圣诞》，一座可探索的摄政街微缩场景。">
  <meta name="theme-color" content="#f7f4ed">
  <title>泽菲拉 · 作品集</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f4ed;
      --ink: #24221f;
      --muted: #635d53;
      --rule: #d7cfc1;
      --accent: #78394e;
      --sans: 'DM Sans', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Songti SC', SimSun, Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.65 var(--sans); }
    a { color: var(--accent); text-underline-offset: .25em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    h1, h2, p, figure { margin: 0; }
    .wrap { width: min(100% - 56px, 1216px); margin-inline: auto; }
    .site-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 75px; border-bottom: 1px solid var(--rule); }
    .wordmark { font-size: .8rem; font-weight: 800; letter-spacing: .16em; }
    .site-header a { font-size: .875rem; text-decoration: none; }
    .site-header a:hover { text-decoration: underline; }
    .intro { padding: clamp(32px, 5vw, 64px) 0 28px; }
    h1 { font: 700 clamp(2.65rem, 5.15vw, 5rem)/1.08 var(--serif); letter-spacing: -.055em; }
    .feature { display: grid; grid-template-columns: 2.5fr 1fr; align-items: stretch; background: #222c44; color: #fff5e6; }
    .feature-art { position: relative; min-height: 100%; aspect-ratio: 2 / 1; overflow: hidden; }
    .feature-art img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 26%; }
    .feature-copy { display: flex; flex-direction: column; justify-content: center; align-items: start; padding: clamp(22px, 3vw, 42px); }
    .project-kind { color: #e1c5a0; font-size: .8125rem; }
    .feature h2 { margin-block: 4px; font: 700 clamp(1.8rem, 3.3vw, 3.25rem)/1.15 var(--serif); }
    .feature-name { font: italic 1.125rem/1.4 var(--serif); color: #eed6b6; }
    .description { margin-block: 15px 20px; color: #f3e6d5; }
    .project-link { display: inline-block; padding: 9px 14px; background: #fff0db; color: #292538; font-size: .875rem; font-weight: 700; text-decoration: none; }
    .feature .project-link:hover { background: #f4dbba; }
    .feature .project-link:focus-visible { outline-color: #fff0db; }
    .details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; padding-block: 40px 70px; scroll-margin-top: 16px; }
    .details h2 { grid-column: 1 / -1; font-size: 1.125rem; }
    .details figure { padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
    .details img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #222c44; }
    figcaption { padding-top: 12px; color: var(--muted); font-size: .9375rem; }

    @media (max-width: 880px) {
      .wrap { width: calc(100% - 36px); }
      .feature { grid-template-columns: 1fr; }
      .feature-art { aspect-ratio: 16 / 10; }
      .feature-copy { padding: 22px; }
    }

    @media (max-width: 620px) {
      .site-header { min-height: 60px; }
      .intro { padding: 30px 0 22px; }
      .details { grid-template-columns: 1fr; gap: 20px; padding-block: 27px 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="site-header wrap">
    <span class="wordmark">ZEPHYRA</span>
    <a href="#details">街景与明信片 <span aria-hidden="true">↓</span></a>
  </header>

  <main class="wrap">
    <h1 class="intro">泽菲拉的作品集</h1>

    <article class="feature" id="feature" aria-labelledby="feature-title">
      <figure class="feature-art">
        <img src="interactive/london-christmas/cover.png" alt="黄昏的伦敦摄政街微缩场景，双层巴士从亮起的金色天使灯下驶过" fetchpriority="high">
      </figure>
      <div class="feature-copy">
        <p class="project-kind">交互与 3D · Field Editions</p>
        <h2 id="feature-title">伦敦圣诞</h2>
        <p class="feature-name" lang="en">A London Christmas</p>
        <p class="description">天使灯点亮摄政街，红色双层巴士驶过积雪的店铺。拖动街景、切换日夜，或点开长椅上的冬日明信片。</p>
        <a class="project-link" href="interactive/london-christmas/index.html">走进伦敦圣诞 <span aria-hidden="true">↗</span></a>
      </div>
    </article>

    <section class="details" id="details" aria-labelledby="details-title">
      <h2 id="details-title">街景与明信片</h2>
      <figure>
        <img src="interactive/london-christmas/street.png" alt="从摄政街路面仰看天使灯，红色双层巴士驶近镜头" loading="lazy">
        <figcaption>切换到街道视角，走到天使灯与红色双层巴士之间。</figcaption>
      </figure>
      <figure>
        <img src="interactive/london-christmas/postcard.png" alt="缀着冬青枝的明信片，画着黄昏时的大本钟和威斯敏斯特桥" loading="lazy">
        <figcaption>从长椅打开一张冬日明信片，看威斯敏斯特桥的灯光落在泰晤士河上。</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
